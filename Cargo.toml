[package]
name = "oxide"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4.1", features = ["import"] }
image = "0.25.10"
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Threading"] }
winit = "0.30.13"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "collision"
harness = false
