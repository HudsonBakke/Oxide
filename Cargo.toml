[package]
name = "oxide"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4.1", features = ["import"] }
image = "0.25.10"
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio_XAudio2", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Threading"] }
urlencoding = "2.1.3"
winit = "0.30.13"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "collision"
harness = false

[[example]]
name = "attachment"
path = "examples/rust/attachment.rs"

[[example]]
name = "cube"
path = "examples/rust/cube.rs"

[[example]]
name = "first_person"
path = "examples/rust/first_person.rs"

[[example]]
name = "hello_window"
path = "examples/rust/hello_window.rs"

[[example]]
name = "materials"
path = "examples/rust/materials.rs"

[[example]]
name = "model"
path = "examples/rust/model.rs"

[[example]]
name = "split_screen"
path = "examples/rust/split_screen.rs"

[[example]]
name = "shadows"
path = "examples/rust/shadows.rs"

[[example]]
name = "audio"
path = "examples/rust/audio.rs"
