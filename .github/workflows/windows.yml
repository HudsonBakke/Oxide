name: Windows build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Select stable Rust with the MSVC toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Enforce consolidated test layout
        run: python tests/check_test_layout.py

      - name: Compile all embedded HLSL shaders
        run: ./scripts/build-shaders.ps1

      - name: Check Rust library, examples, tests, and benchmarks
        id: rust_check
        run: python tests/run_rust_tests.py --check

      - name: 'Rust compile failure: ${{ steps.rust_check.outputs.detail }}'
        if: failure() && steps.rust_check.outcome == 'failure'
        run: exit 1

      - name: Check public Rust documentation
        id: rust_doc
        env:
          RUSTDOCFLAGS: '-D missing_docs -D rustdoc::broken_intra_doc_links'
        run: python tests/run_rust_tests.py --doc

      - name: 'Rust documentation failure: ${{ steps.rust_doc.outputs.detail }}'
        if: failure() && steps.rust_doc.outcome == 'failure'
        run: exit 1

      - name: Run Rust unit and integration tests
        id: rust_tests
        run: python tests/run_rust_tests.py

      - name: 'Rust test failure: ${{ steps.rust_tests.outputs.detail }}'
        if: failure() && steps.rust_tests.outcome == 'failure'
        run: exit 1

      - name: Build native DLL and every Rust example
        run: cargo build --locked --lib --examples

      - name: Build C# bindings and every C# example
        run: |
          dotnet build bindings/csharp/Oxide.NET/Oxide.NET.csproj --configuration Debug -warnaserror:CS1591
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem examples/csharp -Recurse -Filter *.csproj | ForEach-Object {
            dotnet build $_.FullName --configuration Debug
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Check C# camera surfaces, audio, light interface, and native layouts
        run: dotnet run --project tests/csharp/Oxide.Tests.csproj

      - name: Compile and link the C example against oxide.dll
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c11 /W4 /Fe:target\debug\hello_window_c.exe /Fo:target\debug\hello_window_c.obj examples\c\hello_window.c /link /LIBPATH:target\debug oxide.dll.lib

      - name: Install Python bindings
        run: python -m pip install --editable ./bindings/python

      - name: Check Python syntax and native-library imports
        env:
          OXIDE_LIBRARY: ${{ github.workspace }}\target\debug\oxide.dll
        run: |
          python -m compileall -q bindings/python/oxide examples/python tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import oxide; import oxide.app; import oxide.collision; import oxide.content; import oxide.graphics; import oxide.input; import oxide.math"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/python_math.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/python_shadows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/python_audio.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/python_monitors.py
