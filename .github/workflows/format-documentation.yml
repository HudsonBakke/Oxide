name: Format documentation branch
on:
  push:
    branches: [codex/documentation-style]
permissions:
  contents: write
jobs:
  format:
    runs-on: windows-2025
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install formatters
        shell: pwsh
        run: |
          python -m pip install black==25.1.0 clang-format==19.1.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rustfmt
      - name: Format sources
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m black bindings/python examples/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem include, examples/c, bindings/csharp, examples/csharp, shaders -Recurse -File |
            Where-Object { $_.Extension -in '.h', '.c', '.cs', '.hlsl' } |
            ForEach-Object {
              clang-format -i $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
      - name: Build Rust API documentation
        shell: pwsh
        env:
          RUSTDOCFLAGS: '-D missing_docs -D rustdoc::broken_intra_doc_links'
        run: |
          ./scripts/build-shaders.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo doc --locked --no-deps
      - name: Build C# XML documentation
        shell: pwsh
        run: |
          cargo build --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build bindings/csharp/Oxide.NET/Oxide.NET.csproj -p:GenerateDocumentationFile=true -warnaserror:CS1591
      - name: Save formatting results
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' '*.py' '*.cs' '*.c' '*.h' '*.hlsl'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Apply language formatters to documentation cleanup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push
